<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Magleni Istraživač</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* ── Teme ─────────────────────────────────────────────── */
:root {
  --gold:#f0c040; --gold-dim:#a07820; --red:#e53935; --green:#4caf50;
  /* tamna tema (podrazumevano) */
  --bg:#0a0f1e; --bg2:#111827;
  --ui-bg:rgba(8,12,25,0.92); --ui-border:rgba(160,120,32,0.55);
  --txt:#e8dfc0; --txt2:#8a7a50;
  --btn-bg:rgba(20,16,8,0.88); --btn-hover:rgba(240,192,64,0.18);
  --fog-color:rgba(8,12,28,0.93);
  --tile-url:'dark';
  --shadow:rgba(0,0,0,0.6);
  --panel-bg:rgba(6,10,22,0.97);
  --timeline-bg:rgba(8,12,25,0.95);
}
body.light {
  --bg:#e8e4d8; --bg2:#f0ece0;
  --ui-bg:rgba(240,236,224,0.94); --ui-border:rgba(140,100,20,0.4);
  --txt:#2a1f05; --txt2:#7a6030;
  --btn-bg:rgba(240,230,200,0.92); --btn-hover:rgba(180,130,20,0.15);
  --fog-color:rgba(180,160,100,0.88);
  --shadow:rgba(0,0,0,0.2);
  --panel-bg:rgba(245,240,225,0.98);
  --timeline-bg:rgba(240,236,220,0.97);
}

html, body { height:100%; width:100%; overflow:hidden; background:var(--bg); font-family:'Georgia',serif; transition:background 0.4s; }
#map { position:absolute; inset:0; z-index:1; }
#fog-canvas { position:absolute; inset:0; z-index:400; pointer-events:none; }

/* ── HUD ──────────────────────────────────────────────── */
#hud {
  position:absolute; top:0; left:0; right:0; z-index:500;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px 6px;
  background:linear-gradient(to bottom, var(--ui-bg) 55%, transparent);
}
#hud-title { font-size:14px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; text-shadow:0 0 10px var(--gold-dim); }
#stats { display:flex; gap:14px; }
.stat { text-align:center; }
.stat-val { font-size:16px; font-weight:bold; color:var(--gold); text-shadow:0 0 8px var(--gold-dim); }
.stat-lbl { font-size:8px; letter-spacing:2px; color:var(--txt2); text-transform:uppercase; }

/* ── Status bar ───────────────────────────────────────── */
#status-bar { position:absolute; top:52px; left:14px; z-index:500; font-size:9px; letter-spacing:1.5px; color:var(--txt2); text-transform:uppercase; }
#status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#555; margin-right:5px; vertical-align:middle; transition:background 0.3s; }
#status-dot.active   { background:var(--green); box-shadow:0 0 6px var(--green); }
#status-dot.searching{ background:var(--gold); box-shadow:0 0 6px var(--gold); animation:blink 1s infinite; }
#status-dot.error    { background:var(--red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── REC indikator ────────────────────────────────────── */
#route-indicator { position:absolute; top:52px; right:14px; z-index:500; display:none; align-items:center; gap:5px; font-size:9px; letter-spacing:1.5px; color:#ff6b6b; text-transform:uppercase; }
#route-indicator.visible { display:flex; }
#rec-dot { width:7px; height:7px; border-radius:50%; background:#ff6b6b; box-shadow:0 0 8px #ff6b6b; animation:blink 1s infinite; }

/* ── Dugmad ───────────────────────────────────────────── */
#controls {
  position:absolute; bottom:0; left:0; right:0; z-index:500;
  padding:8px 12px 14px;
  background:linear-gradient(to top, var(--ui-bg) 55%, transparent);
  display:flex; gap:7px; align-items:flex-end;
}
.btn {
  flex:1; padding:11px 5px;
  border:1px solid var(--ui-border);
  background:var(--btn-bg); color:var(--gold);
  font-size:10px; letter-spacing:1.2px; text-transform:uppercase;
  cursor:pointer; border-radius:3px; transition:all 0.2s;
  font-family:'Georgia',serif; text-align:center;
  -webkit-tap-highlight-color:transparent;
}
.btn:active { background:var(--btn-hover); border-color:var(--gold); }
.btn.active { background:var(--btn-hover); border-color:var(--gold); box-shadow:0 0 10px rgba(240,192,64,0.3); }
.btn.rec { border-color:#ff6b6b; color:#ff6b6b; }
.btn.rec.active { background:rgba(255,107,107,0.15); box-shadow:0 0 10px rgba(255,107,107,0.4); }
#btn-route { flex:1.5; }

/* ── Vidik slider ─────────────────────────────────────── */
#radius-wrap {
  position:absolute; bottom:74px; right:12px; z-index:500;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--ui-bg); border:1px solid var(--ui-border); border-radius:4px; padding:7px 5px;
}
#radius-wrap label { font-size:8px; letter-spacing:2px; color:var(--txt2); text-transform:uppercase; }
#radius-val { font-size:12px; color:var(--gold); font-weight:bold; }
#radius-slider { writing-mode:vertical-lr; direction:rtl; width:22px; height:70px; cursor:pointer; accent-color:var(--gold); }

/* ── Toast ────────────────────────────────────────────── */
#toast {
  position:absolute; top:68px; left:50%; transform:translateX(-50%); z-index:700;
  background:var(--ui-bg); border:1px solid var(--ui-border); color:var(--gold);
  padding:7px 16px; font-size:10px; letter-spacing:2px; border-radius:3px;
  opacity:0; transition:opacity 0.4s; white-space:nowrap; pointer-events:none;
}
#toast.show { opacity:1; }

/* ── Podešavanja ──────────────────────────────────────── */
#settings-btn {
  position:absolute; top:70px; left:14px; z-index:500;
  width:34px; height:34px; border:1px solid var(--ui-border); border-radius:50%;
  background:var(--ui-bg); color:var(--gold); font-size:16px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#settings-panel {
  position:absolute; top:112px; left:14px; z-index:600;
  background:var(--panel-bg); border:1px solid var(--ui-border); border-radius:5px;
  padding:14px; min-width:210px; display:none; box-shadow:0 4px 20px var(--shadow);
}
#settings-panel.open { display:block; }
.setting-title { font-size:9px; letter-spacing:2px; color:var(--txt2); text-transform:uppercase; margin-bottom:10px; }
.setting-row {
  padding:10px 0; border-bottom:1px solid var(--ui-border);
  display:flex; align-items:center; gap:10px; cursor:pointer;
  color:var(--txt); font-size:11px; letter-spacing:1px;
  -webkit-tap-highlight-color:transparent;
}
.setting-row:last-child { border-bottom:none; }
.setting-row:active { opacity:0.7; }
.setting-icon { font-size:15px; width:22px; text-align:center; }
.setting-row.danger { color:#ff6b6b; }

/* ── PIN lokacije ─────────────────────────────────────── */
.my-pin-outer {
  width:20px; height:20px; border-radius:50%;
  border:2.5px solid var(--gold); background:rgba(240,192,64,0.25);
  animation:pin-pulse 2s infinite; position:relative;
}
.my-pin-inner {
  width:7px; height:7px; border-radius:50%; background:var(--gold);
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  box-shadow:0 0 6px var(--gold);
}
@keyframes pin-pulse {
  0%   { box-shadow:0 0 0 0 rgba(240,192,64,0.5); }
  70%  { box-shadow:0 0 0 10px rgba(240,192,64,0); }
  100% { box-shadow:0 0 0 0 rgba(240,192,64,0); }
}

/* ── ANIMACIJA otkrivanja ─────────────────────────────── */
.reveal-ripple {
  position:absolute; border-radius:50%; pointer-events:none;
  border:2px solid var(--gold); opacity:0.8;
  animation:ripple-out 1.1s ease-out forwards;
  transform:translate(-50%,-50%);
  z-index:450;
}
@keyframes ripple-out {
  0%   { width:0px; height:0px; opacity:0.8; }
  60%  { opacity:0.4; }
  100% { opacity:0; }
}

/* ── TIMELINE ─────────────────────────────────────────── */
#timeline-panel {
  position:absolute; bottom:72px; left:0; right:0; z-index:500;
  background:var(--timeline-bg); border-top:1px solid var(--ui-border);
  padding:10px 16px 8px; display:none;
  box-shadow:0 -4px 16px var(--shadow);
}
#timeline-panel.open { display:block; }
#timeline-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
}
#timeline-title { font-size:10px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; }
#timeline-date  { font-size:11px; color:var(--txt); font-weight:bold; }
#timeline-slider { width:100%; accent-color:var(--gold); cursor:pointer; height:4px; }
#timeline-labels { display:flex; justify-content:space-between; margin-top:4px; }
#timeline-labels span { font-size:8px; color:var(--txt2); }
#timeline-mode-bar {
  display:flex; align-items:center; gap:8px; margin-top:8px; padding-top:8px;
  border-top:1px solid var(--ui-border);
}
#timeline-info { font-size:9px; color:var(--txt2); flex:1; }
#btn-timeline-exit {
  padding:5px 12px; font-size:9px; letter-spacing:1px; border:1px solid var(--ui-border);
  background:var(--btn-bg); color:var(--gold); border-radius:3px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* ── Leaflet overrides ────────────────────────────────── */
.leaflet-container { background:var(--bg); }
.leaflet-control-zoom { display:none; }
.leaflet-attribution-flag { display:none !important; }
.leaflet-control-attribution { font-size:8px !important; opacity:0.3 !important; background:transparent !important; color:#888 !important; }
body.light .leaflet-tile { filter:brightness(1.05) saturate(0.9); }
</style>
</head>
<body>

<div id="map"></div>
<canvas id="fog-canvas"></canvas>

<div id="hud">
  <div id="hud-title">☽ Istraživač</div>
  <div id="stats">
    <div class="stat"><div class="stat-val" id="stat-cells">0</div><div class="stat-lbl">Ćelija</div></div>
    <div class="stat"><div class="stat-val" id="stat-km">0.0</div><div class="stat-lbl">km ruta</div></div>
  </div>
</div>

<div id="status-bar">
  <span id="status-dot"></span><span id="status-text">Pokretanje...</span>
</div>
<div id="route-indicator">
  <div id="rec-dot"></div>
  <span id="rec-label">SNIMANJE</span>
</div>

<!-- Podešavanja -->
<div id="settings-btn" onclick="toggleSettings()">⚙</div>
<div id="settings-panel">
  <div class="setting-title">Podešavanja</div>
  <div class="setting-row" id="theme-row" onclick="toggleTheme()">
    <span class="setting-icon" id="theme-icon">☀️</span>
    <span id="theme-label">Svetla tema</span>
  </div>
  <div class="setting-row" onclick="openTimeline()">
    <span class="setting-icon">🕐</span> Pregled po datumu
  </div>
  <div class="setting-row" onclick="exportData()">
    <span class="setting-icon">📤</span> Izvezi podatke
  </div>
  <div class="setting-row" onclick="importData()">
    <span class="setting-icon">📥</span> Uvezi podatke
  </div>
  <div class="setting-row danger" onclick="confirmReset()">
    <span class="setting-icon">↺</span> Resetuj mapu
  </div>
</div>

<!-- Vidik -->
<div id="radius-wrap">
  <label>Vidik</label>
  <div id="radius-val">80m</div>
  <input type="range" id="radius-slider" min="10" max="500" value="80" step="5">
</div>

<!-- Timeline panel -->
<div id="timeline-panel">
  <div id="timeline-header">
    <span id="timeline-title">⏮ Pregled kroz vreme</span>
    <span id="timeline-date">—</span>
  </div>
  <input type="range" id="timeline-slider" min="0" max="100" value="100" step="1">
  <div id="timeline-labels">
    <span id="tl-start">Početak</span>
    <span id="tl-end">Danas</span>
  </div>
  <div id="timeline-mode-bar">
    <span id="timeline-info">Prikazuje otkrivene ćelije do odabranog datuma</span>
    <button id="btn-timeline-exit" onclick="closeTimeline()">✕ Zatvori</button>
  </div>
</div>

<!-- Kontrole -->
<div id="controls">
  <button class="btn" id="btn-center"  onclick="centerOnMe()">⊙ Ja</button>
  <button class="btn rec" id="btn-route" onclick="toggleRoute()">◉ Snimi rutu</button>
  <button class="btn active" id="btn-track" onclick="toggleTracking()">▣ Prati</button>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// KONFIGURACIJA
// ══════════════════════════════════════════════════════════════
const TILE_DARK  = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
const TILE_LIGHT = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
const STORAGE_KEY   = 'fow_cells_v4';   // {key, ts} format
const ROUTE_KEY     = 'fow_routes_v1';
const THEME_KEY     = 'fow_theme';
const DEF_RADIUS    = 80;
const MIN_MOVE_M    = 8;
const DRAW_THROTTLE = 120;
const GPS_MAX_AGE   = 8000;

// ══════════════════════════════════════════════════════════════
// STANJE
// ══════════════════════════════════════════════════════════════
let map, tileLayer, fogCanvas, ctx;
let locationMarker = null;
let trackingEnabled = true;
let watchId = null;
let currentPos = null;
let revealRadius = DEF_RADIUS;
let drawPending = false;

// Ćelije sa vremenskom oznakom: Map<key, timestamp>
let revealedCells = new Map();
let lastSavedPos = null;

// Rute
let routeRecording = false;
let routePoints = [];
let routePolyline = null;
let allRoutes = [];

// Tema
let isDark = true;

// Timeline
let timelineOpen = false;
let timelineTs = null;   // null = sve; number = do tog timestamp-a
let allTimestamps = [];

// Animacija otkrivanja
let rippleContainer = null;

// ══════════════════════════════════════════════════════════════
// UČITAVANJE PODATAKA
// ══════════════════════════════════════════════════════════════
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const arr = JSON.parse(raw);
      // Podrška za stari format (samo string) i novi ({key,ts})
      arr.forEach(item => {
        if (typeof item === 'string') {
          revealedCells.set(item, 0);
        } else {
          revealedCells.set(item.k, item.t || 0);
        }
      });
    }
  } catch(e) { revealedCells = new Map(); }
  try {
    const r = localStorage.getItem(ROUTE_KEY);
    if (r) allRoutes = JSON.parse(r);
  } catch(e) { allRoutes = []; }
  isDark = localStorage.getItem(THEME_KEY) !== 'light';
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const arr = [...revealedCells.entries()].map(([k,t]) => ({k,t}));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
    } catch(e) {}
  }, 2000);
}
function saveRoutes() {
  try { localStorage.setItem(ROUTE_KEY, JSON.stringify(allRoutes)); } catch(e) {}
}

// ══════════════════════════════════════════════════════════════
// MAPA
// ══════════════════════════════════════════════════════════════
loadSaved();
applyThemeClass();

map = L.map('map', {
  zoomControl:false, attributionControl:true,
  tap:true, maxZoom:18, minZoom:3, preferCanvas:true
}).setView([44.8176, 20.4569], 15);

tileLayer = L.tileLayer(isDark ? TILE_DARK : TILE_LIGHT, {
  attribution:'© CartoDB', subdomains:'abcd', maxZoom:19,
  keepBuffer:1, updateWhenIdle:true,
}).addTo(map);

// ══════════════════════════════════════════════════════════════
// MAGLA
// ══════════════════════════════════════════════════════════════
fogCanvas = document.getElementById('fog-canvas');
ctx = fogCanvas.getContext('2d', { alpha:true });
rippleContainer = document.body;

function resizeFog() {
  fogCanvas.width  = window.innerWidth;
  fogCanvas.height = window.innerHeight;
  drawFog();
}
window.addEventListener('resize', resizeFog);
map.on('move zoom', () => {
  if (drawPending) return;
  drawPending = true;
  setTimeout(() => { drawFog(); drawPending = false; }, DRAW_THROTTLE);
});
map.on('moveend zoomend', () => { drawPending = false; drawFog(); });

function getFogColor() {
  return isDark ? 'rgba(8,12,28,0.93)' : 'rgba(180,160,100,0.88)';
}

function metersToPixels(meters, lat) {
  const z = map.getZoom();
  const mpp = (156543.03392 * Math.cos(lat * Math.PI/180)) / Math.pow(2, z);
  return meters / mpp;
}

function drawFog() {
  const w = fogCanvas.width, h = fogCanvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = getFogColor();
  ctx.fillRect(0, 0, w, h);

  if (revealedCells.size === 0) { updateStats(); return; }

  ctx.globalCompositeOperation = 'destination-out';

  const bounds = map.getBounds();
  const pad = 0.01;
  const minLat = bounds.getSouth()-pad, maxLat = bounds.getNorth()+pad;
  const minLng = bounds.getWest()-pad,  maxLng = bounds.getEast()+pad;

  for (const [key, ts] of revealedCells) {
    // Timeline filter
    if (timelineTs !== null && ts > timelineTs) continue;

    const ci = key.indexOf(','), ri = key.lastIndexOf(',');
    const lat = parseFloat(key.substring(0, ci));
    const lng = parseFloat(key.substring(ci+1, ri));
    const rad = parseInt(key.substring(ri+1));

    if (lat < minLat || lat > maxLat || lng < minLng || lng > maxLng) continue;

    const pt    = map.latLngToContainerPoint(L.latLng(lat, lng));
    const radPx = metersToPixels(rad, lat);

    const g = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, radPx);
    g.addColorStop(0,    'rgba(0,0,0,1)');
    g.addColorStop(0.6,  'rgba(0,0,0,0.97)');
    g.addColorStop(0.85, 'rgba(0,0,0,0.55)');
    g.addColorStop(1,    'rgba(0,0,0,0)');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, radPx, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  updateStats();
}

// ══════════════════════════════════════════════════════════════
// ANIMACIJA OTKRIVANJA
// ══════════════════════════════════════════════════════════════
function spawnRipple(lat, lng) {
  const pt = map.latLngToContainerPoint(L.latLng(lat, lng));
  const radPx = metersToPixels(revealRadius, lat) * 2;

  const el = document.createElement('div');
  el.className = 'reveal-ripple';
  el.style.left = pt.x + 'px';
  el.style.top  = pt.y + 'px';
  el.style.width  = radPx + 'px';
  el.style.height = radPx + 'px';
  document.body.appendChild(el);

  el.addEventListener('animationend', () => el.remove());
}

// ══════════════════════════════════════════════════════════════
// GRID
// ══════════════════════════════════════════════════════════════
const GRID = 0.00008;
function cellKey(lat, lng, rad) {
  const la = (Math.round(lat/GRID)*GRID).toFixed(5);
  const lo = (Math.round(lng/GRID)*GRID).toFixed(5);
  return `${la},${lo},${rad}`;
}

function revealArea(lat, lng, animate=true) {
  const key = cellKey(lat, lng, revealRadius);
  if (!revealedCells.has(key)) {
    const ts = Date.now();
    revealedCells.set(key, ts);
    scheduleSave();
    if (animate) spawnRipple(lat, lng);
    return true;
  }
  return false;
}

// ══════════════════════════════════════════════════════════════
// HAVERSINE
// ══════════════════════════════════════════════════════════════
function haversineM(la1,ln1,la2,ln2) {
  const R=6371000, dL=(la2-la1)*Math.PI/180, dN=(ln2-ln1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dN/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// ══════════════════════════════════════════════════════════════
// GPS
// ══════════════════════════════════════════════════════════════
function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  dot.className = state;
  document.getElementById('status-text').textContent = text;
}

function upsertPin(lat, lng) {
  const html = '<div class="my-pin-outer"><div class="my-pin-inner"></div></div>';
  if (!locationMarker) {
    locationMarker = L.marker([lat,lng], {
      icon: L.divIcon({ html, className:'', iconSize:[20,20], iconAnchor:[10,10] }),
      zIndexOffset:1000
    }).addTo(map);
  } else {
    locationMarker.setLatLng([lat,lng]);
  }
}

function onPosition(pos) {
  const { latitude:lat, longitude:lng, accuracy } = pos.coords;
  if (lastSavedPos && haversineM(lastSavedPos.lat,lastSavedPos.lng,lat,lng) < MIN_MOVE_M) return;
  lastSavedPos = {lat,lng};
  currentPos   = {lat,lng};

  setStatus('active', `GPS ±${Math.round(accuracy)}m`);
  upsertPin(lat, lng);

  // Ne otkrivaj ako je timeline mod aktivan
  if (!timelineOpen) {
    const isNew = revealArea(lat, lng, true);
    if (isNew) drawFog();
  }

  if (routeRecording) {
    routePoints.push({lat,lng,t:Date.now()});
    updateRoutePolyline();
    updateRecLabel();
  }
  if (trackingEnabled) map.setView([lat,lng], map.getZoom(), {animate:false});
}

function onError(err) {
  const m=['','Pristup odbijen','GPS nedostupan','GPS timeout'];
  setStatus('error', m[err.code]||'GPS greška');
}

function startGPS() {
  setStatus('searching','Tražim GPS...');
  if (!('geolocation' in navigator)) { setStatus('error','GPS nije podržan'); return; }
  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy:true, maximumAge:GPS_MAX_AGE, timeout:20000
  });
}

// ══════════════════════════════════════════════════════════════
// RUTE
// ══════════════════════════════════════════════════════════════
function toggleRoute() {
  const btn = document.getElementById('btn-route');
  const ind = document.getElementById('route-indicator');
  if (!routeRecording) {
    routeRecording=true; routePoints=[];
    btn.textContent='■ Zaustavi'; btn.classList.add('active');
    ind.classList.add('visible');
    toast('Snimanje rute počelo');
  } else {
    routeRecording=false;
    btn.textContent='◉ Snimi rutu'; btn.classList.remove('active');
    ind.classList.remove('visible');
    if (routePoints.length >= 2) {
      const km = routeDistanceKm(routePoints);
      allRoutes.push({points:routePoints, date:new Date().toLocaleDateString('sr'), km:km.toFixed(2)});
      saveRoutes();
      toast(`Ruta sačuvana · ${km.toFixed(2)} km`);
    } else { toast('Ruta prekratka, nije sačuvana'); }
    if (routePolyline) { routePolyline.setStyle({color:'#a07820',opacity:0.5}); routePolyline=null; }
  }
}
function updateRoutePolyline() {
  const ll = routePoints.map(p=>[p.lat,p.lng]);
  if (!routePolyline) routePolyline = L.polyline(ll,{color:'#ff6b6b',weight:3,opacity:0.85,smoothFactor:1}).addTo(map);
  else routePolyline.setLatLngs(ll);
}
function updateRecLabel() {
  document.getElementById('rec-label').textContent = `SNIMANJE ${routeDistanceKm(routePoints).toFixed(2)}km`;
}
function routeDistanceKm(pts) {
  let d=0;
  for (let i=1;i<pts.length;i++) d+=haversineM(pts[i-1].lat,pts[i-1].lng,pts[i].lat,pts[i].lng);
  return d/1000;
}
function drawSavedRoutes() {
  for (const r of allRoutes)
    L.polyline(r.points.map(p=>[p.lat,p.lng]),{color:'#a07820',weight:2,opacity:0.4}).addTo(map);
}

// ══════════════════════════════════════════════════════════════
// STATISTIKE
// ══════════════════════════════════════════════════════════════
function updateStats() {
  const visible = timelineTs === null ? revealedCells.size
    : [...revealedCells.values()].filter(t=>t<=timelineTs).length;
  document.getElementById('stat-cells').textContent = visible;
  let km = allRoutes.reduce((s,r)=>s+parseFloat(r.km||0),0);
  if (routeRecording && routePoints.length>1) km += routeDistanceKm(routePoints);
  document.getElementById('stat-km').textContent = km.toFixed(1);
}

// ══════════════════════════════════════════════════════════════
// TIMELINE
// ══════════════════════════════════════════════════════════════
function openTimeline() {
  toggleSettings();
  if (revealedCells.size === 0) { toast('Nema podataka za prikaz'); return; }

  // Skupi sve timestamps i sortiraj
  allTimestamps = [...new Set([...revealedCells.values()].filter(t=>t>0))].sort((a,b)=>a-b);
  if (allTimestamps.length === 0) { toast('Stari podaci nemaju vreme, hodi malo pa pokušaj'); return; }

  const slider = document.getElementById('timeline-slider');
  slider.min   = 0;
  slider.max   = allTimestamps.length - 1;
  slider.value = allTimestamps.length - 1;

  const fmt = ts => new Date(ts).toLocaleDateString('sr-Latn-RS',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('tl-start').textContent = fmt(allTimestamps[0]);
  document.getElementById('tl-end').textContent   = fmt(allTimestamps[allTimestamps.length-1]);
  document.getElementById('timeline-date').textContent = fmt(allTimestamps[allTimestamps.length-1]);

  timelineTs = allTimestamps[allTimestamps.length-1];
  timelineOpen = true;
  document.getElementById('timeline-panel').classList.add('open');
  drawFog();
}

function closeTimeline() {
  timelineOpen = false;
  timelineTs   = null;
  document.getElementById('timeline-panel').classList.remove('open');
  drawFog();
}

document.getElementById('timeline-slider').addEventListener('input', function() {
  const idx = parseInt(this.value);
  timelineTs = allTimestamps[idx];
  const fmt = ts => new Date(ts).toLocaleDateString('sr-Latn-RS',{day:'numeric',month:'short',year:'numeric'});
  document.getElementById('timeline-date').textContent = fmt(timelineTs);
  drawFog();
});

// ══════════════════════════════════════════════════════════════
// TEMA
// ══════════════════════════════════════════════════════════════
function applyThemeClass() {
  document.body.classList.toggle('light', !isDark);
}

function toggleTheme() {
  isDark = !isDark;
  applyThemeClass();
  localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');

  // Zameni tile layer
  map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(isDark ? TILE_DARK : TILE_LIGHT, {
    attribution:'© CartoDB', subdomains:'abcd', maxZoom:19,
    keepBuffer:1, updateWhenIdle:true,
  }).addTo(map);

  document.getElementById('theme-icon').textContent  = isDark ? '☀️' : '🌙';
  document.getElementById('theme-label').textContent = isDark ? 'Svetla tema' : 'Tamna tema';
  drawFog();
  toggleSettings();
  toast(isDark ? 'Tamna tema' : 'Svetla tema');
}

// ══════════════════════════════════════════════════════════════
// PODEŠAVANJA PANEL
// ══════════════════════════════════════════════════════════════
let settingsOpen = false;
function toggleSettings() {
  settingsOpen = !settingsOpen;
  document.getElementById('settings-panel').classList.toggle('open', settingsOpen);
}
map.on('click', () => {
  settingsOpen = false;
  document.getElementById('settings-panel').classList.remove('open');
});

function confirmReset() {
  toggleSettings();
  if (confirm('Obrisati SVA otkrivena mesta i sve rute?\n\nOvo se ne može poništiti!')) {
    revealedCells.clear(); allRoutes=[]; routePoints=[];
    localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(ROUTE_KEY);
    map.eachLayer(l => { if (l instanceof L.Polyline) map.removeLayer(l); });
    closeTimeline();
    drawFog();
    toast('Mapa resetovana');
  }
}

function exportData() {
  toggleSettings();
  const arr = [...revealedCells.entries()].map(([k,t])=>({k,t}));
  const blob = new Blob([JSON.stringify({cells:arr, routes:allRoutes, izvezeno:new Date().toISOString()})], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `magleni-istrazivac-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(a.href);
  toast('Podaci izvezeni');
}

function importData() {
  toggleSettings();
  const input = document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.cells) data.cells.forEach(item => {
          if (typeof item==='string') revealedCells.set(item,0);
          else revealedCells.set(item.k, item.t||0);
        });
        if (data.routes) allRoutes = allRoutes.concat(data.routes);
        scheduleSave(); saveRoutes();
        drawSavedRoutes(); drawFog();
        toast('Podaci uvezeni!');
      } catch(err) { toast('Greška pri uvozu'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ══════════════════════════════════════════════════════════════
// KONTROLE
// ══════════════════════════════════════════════════════════════
function centerOnMe() {
  if (currentPos) { map.setView([currentPos.lat,currentPos.lng],17,{animate:true}); toast('Centrirano'); }
  else toast('Lokacija nije dostupna');
}
function toggleTracking() {
  trackingEnabled = !trackingEnabled;
  const btn = document.getElementById('btn-track');
  btn.textContent = trackingEnabled ? '▣ Prati' : '□ Prati';
  btn.classList.toggle('active', trackingEnabled);
  toast(trackingEnabled ? 'Praćenje uključeno' : 'Praćenje isključeno');
}

document.getElementById('radius-slider').addEventListener('input', function() {
  revealRadius = parseInt(this.value);
  document.getElementById('radius-val').textContent = revealRadius + 'm';
});

// Ručno otkrivanje tapom
map.on('click', function(e) {
  if (settingsOpen || timelineOpen) return;
  revealArea(e.latlng.lat, e.latlng.lng, true);
  drawFog();
});

// Pauza GPS kad ekran nije aktivan
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;} }
  else { if(watchId===null) startGPS(); }
});

// ══════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════════════════════════
// POKRETANJE
// ══════════════════════════════════════════════════════════════
// Postavi ikonu teme
document.getElementById('theme-icon').textContent  = isDark ? '☀️' : '🌙';
document.getElementById('theme-label').textContent = isDark ? 'Svetla tema' : 'Tamna tema';

resizeFog();
drawSavedRoutes();
startGPS();
toast('Krećite se da otkrijete mapu!');
</script>
</body>
</html>
